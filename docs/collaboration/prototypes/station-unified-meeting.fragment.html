    @media (max-width:850px) {

      #station-unified-preview .st-column { min-height:120px; }

<script>
(() => {
  const root = document.getElementById('station-unified-preview');
  const app = root.querySelector('#station-preview-app');
  const controls = root.querySelector('#station-preview-controls');
  const sampleGoal = '完善登录接口并补齐自动化测试，同时交付独立的项目使用说明。由 Host 按完整交付拆分，说明各任务由哪台电脑执行。';
  const state = {
    viewer:'A',tab:'meeting',side:'chat',sheet:null,detailTab:'overview',selectedTask:'TASK-01',selectedFile:0,
    onlineB:true,receivingA:true,receivingB:true,members:[],draftMembers:[],nativeJoined:false,draftNative:false,
    mode:'manual',autoApprove:false,approved:false,dispatched:false,goal:'',composer:sampleGoal,
    mentionOpen:false,mentionQuery:'',mentionStart:0,mentionEnd:0,mentionIndex:0,settingsSection:'account',
    setup:{account:'eternal',deviceA:'电脑 A',deviceB:'电脑 B',githubA:true,githubB:true,repo:'https://github.com/your-account/codex-test',pathA:'C:/work/codex-test',pathB:'D:/working/codex-test',grantA:true,grantB:true},
    tasks:[],messages:[{who:'Host · Codex',type:'host',text:'我在电脑 A 主持这场会议。你可以邀请其他电脑，在这里提出完整目标；计划、任务和结果都留在当前会议。'}],
    native:{mode:'idle',synced:'idle',desktopBusy:true,text:'',stopRequested:false},hostReviewed:false,accepted:false,notice:'',
  };
  const previous = window.openai?.widgetState?.privateContent;
  if (previous?.version === 1) {
    if (['A','B'].includes(previous.viewer)) state.viewer=previous.viewer;
    if (['meeting','tasks'].includes(previous.tab)) state.tab=previous.tab;
  }
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label = id => `${esc(state.setup['device'+id]||'电脑 '+id)}${id===state.viewer?'（本机）':''}`;
  const online = id => id==='A'||state.onlineB;
  const receives = id => id==='A'?state.receivingA:state.receivingB;
  const currentTask = () => state.tasks.find(t=>t.id===state.selectedTask);
  const visibleLevel = t => t.device===state.viewer?t.level:t.synced;
  const visibleStopped = t => t.device===state.viewer?t.stopped:t.syncedStopped;
  const visibleStopRequested = t => online(t.device)?t.stopRequested:t.stopRequested&&t.stopSource===state.viewer;
  const badge = (text,kind='') => `<span class="st-badge ${kind}">${esc(text)}</span>`;
  const button = (action,text,kind='',disabled=false,extra='') => `<button type="button" class="st-button ${kind}" data-action="${action}" ${disabled?'disabled':''} ${extra}>${text}</button>`;
  const msg = (who,text,type='host') => {state.messages.push({who,text,type});state.messages=state.messages.slice(-16);};
  function persist() {
    if (typeof window.openai?.setWidgetState === 'function') {
      Promise.resolve(window.openai.setWidgetState({
        modelContent:{prototype:'统一原会议与任务',viewer:state.viewer,view:state.tab,selectedDevices:state.members.map(x=>'电脑 '+x),localExecutionOptIn:state.members.includes('A'),planApproved:state.approved,taskStates:state.tasks.map(t=>({task:t.title,device:t.device,stage:status(t).text}))},
        privateContent:{version:1,viewer:state.viewer,tab:state.tab},
      })).catch(()=>{});
    }
  }
  function status(t) {
    const level=visibleLevel(t);
    if (visibleStopped(t)) return {text:'已停止 · 等待明确继续',kind:'wait'};
    if (visibleStopRequested(t)&&!t.syncedStopped) return {text:'停止待确认',kind:'wait'};
    if (level<0) return {text:state.approved?'已批准 · 待分配':'计划待批准',kind:'wait'};
    if (level===0) return {text:online(t.device)?'已发出 · 等待设备接收':'等待设备上线 · 尚未接收',kind:'wait'};
    if (level===1) return {text:'已接收 · 等待执行名额',kind:'active'};
    if (level===2&&!online(t.device)) return {text:t.device===state.viewer?'本机继续执行 · 等待恢复同步':'执行状态待同步',kind:'wait'};
    if (level===2) return {text:'执行中',kind:'active'};
    if (level===3&&!online(t.device)&&t.device===state.viewer) return {text:'成果已保存在本机 · 待上传',kind:'wait'};
    if (level===3) return {text:'成果已上传 · 等待 Host 检查',kind:'active'};
    return {text:state.accepted?'已验收':'检查通过 · 待最终验收',kind:'good'};
  }
  function nativeState() {
    const n=state.native;
    const mode=state.viewer==='B'?n.mode:n.synced;
    if(n.mode==='queued'&&!state.onlineB&&n.synced==='idle')return '等待设备上线 · 尚未接收';
    if(n.stopRequested&&mode!=='stopped')return '停止待确认';
    return ({idle:'原对话可用',queued:n.desktopBusy?'等待 Codex 桌面当前轮次结束':'等待本机执行名额',running:state.onlineB?'Station 接续执行中':'状态等待恢复同步',completed:'接续完成 · 原上下文保留',stopped:'已停止 · 等待明确继续'})[mode];
  }
  function makePlan() {
    const candidates=state.members.filter(id=>online(id)&&receives(id));
    if(!candidates.length){state.notice='请先邀请至少一台已就绪的执行设备。本机也可以由你明确勾选。';return;}
    const first=candidates.includes('B')?'B':candidates[0];
    const second=candidates.includes('A')?'A':first;
    const common={level:-1,synced:-1,attempt:1,stopped:false,syncedStopped:false,stopRequested:false,manualConfirmed:false};
    state.tasks=[
      {...common,id:'TASK-01',title:'登录接口与回归测试',device:first,brief:'完成登录接口的输入校验与错误处理，补齐成功、失败和异常场景测试，交付代码、实际测试记录和修改说明。',files:['src/auth/login.ts','tests/auth/login.test.ts'],tests:'6 项回归测试通过（示例）',branch:'station/task-login-api',commit:'a81d7c2',result:'已完成输入校验、统一错误处理，并覆盖成功、密码错误和无效参数场景。'},
      {...common,id:'TASK-02',title:'项目使用说明完整交付',device:second,brief:'以当前仓库已约定的配置与接口为依据，编写安装、启动、配置及常见问题说明，检查命令与链接，交付可直接使用的文档。',files:['docs/GETTING_STARTED.md'],tests:'文档命令与链接检查通过（示例）',branch:'station/task-project-guide',commit:'c42e9a6',result:'已整理安装、启动、配置和常见问题，形成独立可用的项目使用说明。'},
    ];
    state.tasks.forEach(t=>{t.suggestedDevice=t.device;});
    state.approved=false;state.dispatched=false;state.hostReviewed=false;state.accepted=false;

  function advance() {
    let changed=false;
    const oldLevels=new Map(state.tasks.map(t=>[t.id,t.level]));
    for(const t of state.tasks) {
      if(t.stopped)continue;
      if(t.stopRequested&&(online(t.device)||t.stopSource===t.device)) {
        t.stopped=true;if(online(t.device))t.syncedStopped=true;changed=true;
        continue;
      }
      if(t.level===0&&online(t.device)&&receives(t.device)&&state.members.includes(t.device)){t.level=1;changed=true;}
      else if(t.level===1) {
        const occupied=state.tasks.some(x=>x.id!==t.id&&x.device===t.device&&!x.stopped&&(oldLevels.get(x.id)===2||x.level===2))||(t.device==='B'&&state.native.mode==='running');
        if(!occupied){t.level=2;changed=true;}
      }
      else if(t.level===2){t.level=3;changed=true;}
      else if(t.level===3&&t.synced>=3){t.level=4;changed=true;}
      if(online(t.device))t.synced=t.level;
    }
    const n=state.native;
    if(n.stopRequested&&(state.onlineB||n.stopSource==='B')&&n.mode!=='stopped'){n.mode='stopped';changed=true;}
    else if(n.mode==='queued'&&state.onlineB&&!state.tasks.some(t=>t.device==='B'&&t.level===2&&!t.stopped)){
      n.desktopBusy=false;n.mode='running';changed=true;msg('codex-test · 电脑 B','桌面原轮次已结束，正在同一对话接续你的 Station 指令。','native');
    }else if(n.mode==='running'){n.mode='completed';changed=true;}
    if(state.onlineB)n.synced=n.mode;
    if(state.tasks.length&&state.tasks.every(t=>t.synced>=4)&&!state.hostReviewed){state.hostReviewed=true;msg('Host · Codex','两项成果已到达并通过检查与组合验证。你可以逐项查看文件、实际测试记录和 PR，再决定是否最终验收。');}
    if(n.mode==='completed'&&n.synced==='completed'&&!n.reported){n.reported=true;msg('codex-test · 电脑 B','已在原对话上下文完成接续要求。（示例回复）','native');}
    state.notice=changed?'演示状态已推进。可切到另一台电脑视角，核对同一会议的状态。':'当前等待设备、执行名额或明确继续；没有改派或重复启动。';
  }
  function resume(t) {
    if(!online(t.device)){t.continueRequested=true;state.notice='继续要求已保存，等待原执行设备恢复；保留同一任务和工作区。';return;}
    t.attempt++;t.stopped=false;t.syncedStopped=false;t.stopRequested=false;t.continueRequested=false;t.level=1;t.synced=1;
    msg('Host · Codex',`收到明确继续要求：“${t.title}”在原设备和原工作区继续，保留已有成果。`);
    state.notice='原任务等待执行名额，未从头新建另一项任务。';
  }
  function syncB() {
    if(!state.onlineB)return;
    for(const t of state.tasks.filter(x=>x.device==='B')){t.synced=t.level;t.syncedStopped=t.stopped;if(t.continueRequested)resume(t);}
    state.native.synced=state.native.mode;
  }

      }else if(target?.key.startsWith('exec-')){

        msg(`你 · ${label(state.viewer)}`,text,'mine');
        if(!state.tasks.length&&/接口|交付|实现|完善|开发/.test(text)){state.goal=text;makePlan();}
        else if(!state.tasks.length){msg('Host · Codex','收到这条群聊消息。需要执行工作时，请说明目标和预期交付，我会先提出计划。');state.notice='文字消息留在同一会议，不自动变成任务。';}
        else {msg('Host · Codex','收到。当前仍沿用这份会议计划与任务记录；进度和成果可在任务界面查看，不重复派发同一目标。');state.notice='同一会议、同一 Host，原任务保留。';}
      }
      state.composer='';state.mentionOpen=false;
    }
    else if(a==='approve-plan'){
      if(state.mode==='manual'&&state.tasks.some(t=>!t.manualConfirmed)){state.notice='请逐项选择执行设备。手动分配不会自动采用 Host 的建议。';render();return;}
      state.approved=true;state.sheet=null;
      msg('Host · Codex',`计划已批准：${state.tasks.map(t=>t.title+' → 电脑 '+t.device+' / Codex').join('；')}。`);
      if(state.mode==='auto')dispatch();else state.notice='计划已批准，尚未派发。点击“按计划分配任务”开始。';
    }
    else if(a==='reject-plan'){state.approved=false;state.sheet=null;state.notice='计划未批准，尚未执行；可继续向 Host 说明需要修改的地方。';}
    else if(a==='dispatch')dispatch();
    else if(a==='advance')advance();
    else if(a==='request-stop')state.sheet='stop';
    else if(a==='cancel-stop')state.sheet='task';
    else if(a==='confirm-stop'){
      const t=currentTask();t.stopRequested=true;t.stopSource=state.viewer;state.sheet='task';state.notice='停止请求已保存。演示下一阶段核对实际退出，确认前不释放名额。';
    }
    else if(a==='continue-task')resume(currentTask());
    else if(a==='detail-delivery')state.detailTab='delivery';
    else if(a==='pr')state.sheet='pr';
    else if(a==='back-delivery'){state.sheet='task';state.detailTab='delivery';}
    else if(a==='fetch-preview'){state.notice='演示：按准确提交取回独立成果副本，不覆盖当前项目。下方仅预览示例内容。';}
    else if(a==='final')state.sheet='final';
    else if(a==='open-result'){state.selectedTask=el.dataset.id;state.selectedFile=0;state.detailTab='delivery';state.sheet='task';}
    else if(a==='accept-final'){state.accepted=true;state.notice='演示：会议成果已验收。PR 仍由你到 GitHub 审查和决定合并。';}
    else if(a==='reconnect'){if(state.viewer==='B'){state.onlineB=true;syncB();}state.notice='演示：本机连接已就绪，原设备身份和任务记录保留。';}
    else if(a==='stop-native'){state.native.stopRequested=true;state.native.stopSource=state.viewer;state.notice='只停止这项 Station 接续；等待项不会停止桌面当前轮次。推进演示后核对退出。';}
    else if(a==='continue-native'){state.native.stopRequested=false;state.native.mode='queued';if(state.onlineB)state.native.synced='queued';state.native.reported=false;state.notice='已明确继续同一原生对话的接续，不新建替代对话。';}
    render();persist();
    if(a==='mention-open'){const input=root.querySelector('[data-field="composer"]');input?.focus();input?.setSelectionRange(state.composer.length,state.composer.length);}
  });
  root.addEventListener('input',event=>{
    const field=event.target.dataset.field;
    if(field==='composer'){
      state.composer=event.target.value;const end=event.target.selectionStart;const match=state.composer.slice(0,end).match(/(?:^|\s)@([a-zA-Z0-9._-]*)$/);
      state.mentionOpen=!!match;state.mentionQuery=match?.[1]??'';state.mentionEnd=end;state.mentionStart=end-state.mentionQuery.length-1;state.mentionIndex=0;updateMentionMenu();
    }
    if(field==='setup-account')state.setup.account=event.target.value;
    if(field==='setup-device')state.setup['device'+state.viewer]=event.target.value;
    if(field==='setup-repo'||field==='setup-path'){
      state.setup[field==='setup-repo'?'repo':'path'+state.viewer]=event.target.value;
      state.setup['grant'+state.viewer]=false;const checkbox=root.querySelector('[data-field="setup-grant"]');if(checkbox)checkbox.checked=false;
    }
    if(field==='plan-goal'){state.goal=event.target.value;state.approved=false;}
  });
  root.addEventListener('change',event=>{
    const e=event.target;const field=e.dataset.field;
    if(field==='viewer')state.viewer=e.value;
    else if(field==='onlineB'){state.onlineB=e.value==='on';syncB();state.notice=state.onlineB?'电脑 B 已恢复，补传原任务状态；没有重新派发。':'演示电脑 B 断线：已接任务继续并保留结果，未接任务等待。';}
    else if(field==='draft-member'){state.draftMembers=e.checked?[...new Set([...state.draftMembers,e.dataset.id])]:state.draftMembers.filter(x=>x!==e.dataset.id);}
    else if(field==='draft-native')state.draftNative=e.checked;
    else if(field==='setup-grant')state.setup['grant'+state.viewer]=e.checked;
    else if(field==='mode'){
      state.mode=e.value;state.approved=state.autoApprove;
      if(state.mode==='auto')state.tasks.forEach(t=>{t.device=t.suggestedDevice;});
      else state.tasks.forEach(t=>{t.manualConfirmed=false;});
      if(state.mode==='auto'&&state.autoApprove&&!state.dispatched){state.sheet=null;dispatch();}
    }
    else if(field==='autoApprove'){
      state.autoApprove=e.checked;
      if(e.checked){
        state.approved=true;
        if(state.mode==='auto'){state.sheet=null;dispatch();}
        else state.notice='计划已按设置自动批准，执行设备仍须由你逐项指定，不自动替你选择。';
      }else state.notice='后续计划改为手动批准；已经获准的安排不会自动撤销。';
    }
    else if(field==='plan-device'){
      const t=state.tasks.find(t=>t.id===e.dataset.id);if(t&&!state.dispatched){if(e.value)t.device=e.value;t.manualConfirmed=!!e.value;state.approved=state.autoApprove;state.notice='执行设备安排已明确修改，须按计划批准规则确认后派发。';}
    }
    else if(field==='receive'){state['receiving'+state.viewer]=e.checked;state.notice=e.checked?'已允许接收新工作；仍须在会议中被选入。':'已关闭本机新工作接收；已有任务继续，主持与查看不受影响。';}
    else return;
    render();persist();
  });
  root.addEventListener('keydown',event=>{
    if(event.target.dataset.field!=='composer'||event.isComposing)return;
    const items=mentionTargets().filter(t=>(t.token+' '+t.name+' '+t.detail).toLowerCase().includes(state.mentionQuery.toLowerCase()));
    if(state.mentionOpen&&['ArrowDown','ArrowUp'].includes(event.key)&&items.length){event.preventDefault();state.mentionIndex=(state.mentionIndex+(event.key==='ArrowDown'?1:items.length-1))%items.length;updateMentionMenu();return;}
    if(state.mentionOpen&&['Enter','Tab'].includes(event.key)&&items.length){event.preventDefault();selectMention(items[state.mentionIndex]?.key??items[0].key);return;}
    if(event.key==='Escape'){state.mentionOpen=false;updateMentionMenu();return;}
    if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();root.querySelector('[data-action="send"]')?.click();}
  });
  window.addEventListener('openai:set_globals',event=>{
    const p=event.detail?.globals?.widgetState?.privateContent;if(p?.version!==1)return;
    if(['A','B'].includes(p.viewer))state.viewer=p.viewer;
    if(['meeting','tasks'].includes(p.tab))state.tab=p.tab;
    render();
  });
  render();
})();
</script>
